<div class="login-wrapper">
  <!-- Panel izquierdo decorativo -->
  <aside class="login-brand">
    <div class="brand-content">
      <div class="brand-logo">
        <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
          <circle cx="28" cy="28" r="28" fill="white" fill-opacity="0.15"/>
          <path d="M14 28C14 20.268 20.268 14 28 14s14 6.268 14 14-6.268 14-14 14S14 35.732 14 28z" fill="white" fill-opacity="0.3"/>
          <path d="M20 28a8 8 0 1 1 16 0 8 8 0 0 1-16 0z" fill="white"/>
        </svg>
      </div>
      <h1 class="brand-title">Centro Crecer</h1>
      <p class="brand-subtitle">Sistema de Gestión Institucional</p>
      <div class="brand-decoration">
        <div class="deco-circle deco-1"></div>
        <div class="deco-circle deco-2"></div>
        <div class="deco-circle deco-3"></div>
      </div>
    </div>
  </aside>
 
  <!-- Panel derecho: formulario -->
  <main class="login-form-panel">
    <div class="login-card">
      <div class="card-header">
        <h2>Iniciar Sesión</h2>
        <p>Seleccioná tu tipo de acceso para continuar</p>
      </div>
 
      <!-- Selector de tipo de usuario -->
      <div class="tipo-selector">
        <button
          class="tipo-btn"
          [class.activo]="tipoUsuario === 'funcionario'"
          (click)="seleccionarTipo('funcionario')"
          type="button"
        >
          <span class="tipo-icon">🏛️</span>
          <span>Funcionario</span>
        </button>
        <button
          class="tipo-btn"
          [class.activo]="tipoUsuario === 'responsable'"
          (click)="seleccionarTipo('responsable')"
          type="button"
        >
          <span class="tipo-icon">👨‍👩‍👧</span>
          <span>Responsable</span>
        </button>
      </div>
 
      <!-- Error -->
      <div class="error-msg" *ngIf="error">
        <span>⚠️</span> {{ error }}
      </div>
 
      <!-- Formulario -->
      <div class="form-group">
        <label for="correo">Correo electrónico</label>
        <div class="input-wrapper">
          <span class="input-icon">✉️</span>
          <input
            id="correo"
            type="email"
            [(ngModel)]="correo"
            placeholder="tucorreo@ejemplo.com"
            autocomplete="email"
          />
        </div>
      </div>
 
      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input
            id="password"
            [type]="mostrarPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            placeholder="Tu contraseña"
            autocomplete="current-password"
          />
          <button class="toggle-pass" type="button" (click)="togglePassword()">
            {{ mostrarPassword ? '🙈' : '👁️' }}
          </button>
        </div>
      </div>
 
      <button
        class="btn-ingresar"
        (click)="iniciarSesion()"
        [disabled]="cargando"
        type="button"
      >
        <span *ngIf="!cargando">Ingresar</span>
        <span *ngIf="cargando" class="spinner">⏳ Verificando...</span>
      </button>
 
      <p class="registro-link">
        ¿No tenés cuenta?
        <a routerLink="/registro">Registrarse</a>
      </p>
    </div>
  </main>
</div>
